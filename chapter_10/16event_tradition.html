<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traditional Event</title>
    <script>
        //이벤트를 연결합니다.
        window.onload = function () {
            //문서 객체를 선택합니다.
            let button = document.getElementById('button');

            //이벤트를 연결합니다.
            button.onclick = function () {
                alert('click');
            };
        };
    </script>
</head>

<body>
    <button id="button">버튼</button>


    <hr>
    <h2>04이벤트</h2>
    <ol>
        <li><b>이벤트 연결</b>
            <ul>
                <li>1인라인 이벤트 모델(문서 객체에 이벤트를 연결하는 방식) 사용하기</li>
                <li>2script태그에 인라인 이벤트 모델 사용하기</li>
                <li><b>3고전 이벤트 모델</b><br></li>
            </ul>
        </li>
        <li>이벤트 사용</li>
    </ol>

</body>

</html>
