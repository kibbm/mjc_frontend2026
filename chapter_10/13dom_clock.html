<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Basic</title>
    <script>
        //이벤트를 연결합니다.
        window.onload = function () {
            // 문서 객체를 선택합니다.
            let clock = document.getElementById('clock');

            // 1초마다 함수를 실행합니다.
            setInterval(function () {
                let now = new Date();
                clock.innerHTML = now.toString();
            }, 1000);
        };
    </script>
</head>

<body>
    <h1 id="clock"></h1>


    <hr>
    <h2>03문서 객체 조작</h2>
    <ol>
        <li>글자 조작</li>
        <li>스타일 조작</li>
        <li><b>속성 조작</b></li>
    </ol>

    <p>.3-1 img태그 속성 조작하기
        .3-2 body태그 속성 조작하기
    </p>

</body>

</html>
