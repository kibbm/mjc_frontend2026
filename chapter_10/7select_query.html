<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Basic</title>
    <script>
        //이벤트를 연결합니다.
        window.onload = function(){
            // 문서 객체를 선택합니다.
            let header = document.querySelector('h1');

            // 문서 객체를 조작합니다.
            header.style.color = 'orange';
            header.style.background = 'red';
            header.innerHTML = 'From JavaScript';
        };
    </script>
</head>

<body>
    <h1>Header</h1>
    <h1>Header</h1>
    <h1>Header</h1>

    <hr>
    <h2>02문서 객체 선택</h2>
    <h4>2querySelector()메서드를 사용해 문서 객체 1개 선택하기</h4>
    <p>. id속성 대신 선택자를 사용하는 점만 다르고 getElementById()메서드와 사용 방법은 같습니다. 
        단 querySelector()메서드는 문서 객체 하나를 선택하므로 
        이름이 같은 선택자가 여러 개라면 가장 먼저 등장하는 것을 선택합니다.
    </p>

</body>

</html>
