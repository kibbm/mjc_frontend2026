<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1form_basic</title>
</head>

<body>
    <form>
        <!--사용자가 입력하는 입력 양식-->
        <input type="text" name="text" value="text"><br>
        <input type="password" name="password" value="value"><br>
        <input type="file" name="file" value="file"><br>
        <input type="checkbox" name="checkbox" value="checkbox"><br>
        <input type="radio" name="radio" value="radio"><br>

        <!--보이지 않는 입력 양식-->
        <input type="hidden" name="hidden" value="hidden"><br>

        <!--버튼-->
        <input type="button" value="button"><br>
        <input type="reset" value="reset"><br>
        <input type="submit" value="submit"><br>
        <!--<input type="image" src="http://via.placeholder.com/100x100"> 교재 코드 오류--> 
        <input type="image" src="placeholder.svg" width="100" height="100" alt="제출">
        <input type="image" src="../chapter_3/Penguins.jpg" width="100" height="100" alt="펭귄"><!--상대 경로-->
    </form>

</body>

</html>
