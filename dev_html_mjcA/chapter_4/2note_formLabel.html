<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>2note_formLabel / 3form_radio</title>
</head>

<body>

    <h2>2note_formLabel / 3form_radio</h2>
    <form>
        <table>
            <tr>
                <td> <label for="name">이름</label></td>
                <td> <input id="name" type="text" name="username"><br></td>
            </tr>
            <tr>
                <td>성별</td>
                <td>
                    <input id="man" type="radio" name="gender" value="m">
                    <label for="man">남성</label>
                    <input id="woman" type="radio" name="gender" value="w">
                    <label for="woman">여성</label>
                </td>
            </tr>
        </table>
        <input type="submit" value="가입">
    </form>
