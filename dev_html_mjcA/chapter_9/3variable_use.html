    <script>
 /*       //변수를 선언 및 초기화합니다.
        let radius = 10;

        //출력합니다.

*/        

// const키워드: let을 붙인 식별자는 변수, const를 붙인 식별자는 상수.
const gravity = 9.8;
alert(gravity);

//radius와 pi가 이후로 바뀌지 않으므로 
//상수로 선언하는 것이 좋습니다.
const radius = 10;
const pi = 3.14159265;
alert(2*radius*pi);
