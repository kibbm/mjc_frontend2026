<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Basic</title>
    <script>
        //Date객체를 선언합니다.
        let date = new Date();
        let hours = date.getHours();
        
        //조건문
        if(hours < 12){
            //표현식 "hours < 12"가 참이면 실행되는 문장
            alert("오전입니다.");
        }
        if(12 <= hours){
            //표현식 "12 <= hours"가 참이면 실행되는 문장
            alert("오후입니다.");
        }            
    </script>
</head>
<body>
    오전과 오후 구분하기<hr>

    <h3>3. 조건문과 반복문</h3>
    <h5>    1_조건문</h5>
    <h5>    2_반복문</h5>
</body>
</html>
