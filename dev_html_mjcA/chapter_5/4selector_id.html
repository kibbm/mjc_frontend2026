<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    
    <title>CSS3 Selector Basic</title>
    <style>
        #header{
            width:800px; margin:0 auto;
            background: red;
        }
        #wrap{
            width:800px; margin:0 auto;
            overflow: hidden;
        }
        #aside{
            width: 200px; float: left;
            background: blue;
        }
        #content{
            width: 600px; float: left;
            background-color: green;
        }
        </style>
</head>
<body>    
    <h2>2. 기본 선택자</h2>
    <hr>
    
    <div id="header">
        <h1>#header 태그</h1>
    </div>
    <div id="wrap">
        <div id="aside">
            <h1>#aside 태그</h1>
        </div>
        <div id="content">
            <h1>#content태그</h1>
        </div>
    </div>

</body>
</html>
