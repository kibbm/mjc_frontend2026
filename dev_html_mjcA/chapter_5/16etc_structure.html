<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <title>16etc_structure</title>
    <style>
        ul{overflow: hidden;}
        li{
            list-style: none;
            float: left;
            padding: 15px;
        }
        li:first-child{ border-radius: 10px 0 0 10px;}
        li:last-child{ border-radius: 0 10px 10px 0;}

        li:nth-child(2n) { background-color: #FF0003; }
        li:nth-child(2n+1) { background-color: #800000;}
    </style>

</head>

<body>
    <h2>5. 반응/상태/구조 선택자</h2>
    <h3>5.3 구조 선택자</h3>
    <p>
        :first-child          형제 관계에서 첫 번째로 등장하는 태그 선택<br>
        :last-child           형제 관계에서 마지막으로 등장하는 태그 선택<br>
        :nth-child(수열)      형제 관계에서 앞에서 수열 번째로 등장하는 태그 선택<br>
        :nth-last-child(수열) 형제 관계에서 뒤에서 수열 번째로 등장하는 태그 선택<br>
    </p>
    <hr>

    <ul>
        <li>첫 번째</li>
        <li>두 번째</li>
        <li>세 번째</li>
        <li>네 번째</li>
        <li>다섯 번째</li>
        <li>여섯 번째</li>
        <li>일곱 번째</li>
    </ul>


</body>

</html>
