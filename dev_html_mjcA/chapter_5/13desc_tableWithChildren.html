<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <title>CSS3 Selector Basic</title>
    <style>
        table>tr>td {
            color: red;
        }
    </style>
</head>

<body>
    <h2>4. 후손 선택자와 자손 선택자</h2>
    <h3>4.2 자손 선택자</h3>
    <p>주의! table태그에 스타일을 적용할 때는 자손 선택자를 사용하면 안됨.</p>
    <hr>

    <table border="1">
        <tr>
            <th>이름</th>
            <th>지역</th>
        </tr>
        <tr>
            <td>이기쁨</td>
            <td>서울특별시 서대문구 가좌로 134</td>
        </tr>
    </table>

</body>

</html>
