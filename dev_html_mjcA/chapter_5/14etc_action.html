<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <title>5반응/상태/구조 선택자</title>
    <style>
        h1:hover {
            color: red;
        }

        h1:active {
            color: blue;
        }
    </style>
</head>

<body>
    <h2>5. 반응/상태/구조 선택자</h2>
    <h3>5.1 반응 선택자</h3>
    <p> :active 사용자가 마우스로 클릭한 태그 선택<br>
        :hover  사용자가 마우스 커서를 올린 태그 선택<br>
    </p>
    <hr>

    

    <h1>반응 선택자</h1>
</body>

</html>
