    <title>19CSS3Unit_basic</title>
    <style>
        /* 2. %단위 적용하기
        주의>> 18~24주석처리!...nth-child()는 <p>만 세는 게 아니라, 같은 부모 아래의 모든 형제 요소를 세기 때문 */
        /* p:nth-child(1) {}
        p:nth-child(2) {            font-size: 100%;        }
        p:nth-child(3) {            font-size: 150%;        }
        p:nth-child(4) {            font-size: 200%;        } */

        /* 3. em단위 적용하기: 배수를 나타내는 단위. 
                            1배   =   1em = 100%
                            1.5배 = 1.5em = 150%    */
        
        /* p:nth-child(1) {}
        p:nth-child(2) {            font-size: 1.0em;        }
        p:nth-child(3) {            font-size: 1.5em;        }
        p:nth-child(4) {            font-size: 2.0em;        } */
        
        /* 4. px단위 적용하기: px단위는 크기를 절대적으로 지정함.
                  p태그의 기본 font-size속성이 16px 이므로 실행결과 같음. */
        p:nth-child(1) {}
        p:nth-child(2) {            font-size: 16px;        }
        p:nth-child(3) {            font-size: 24px;        }
        p:nth-child(4) {            font-size: 32px;        }







        /* 참고: <p>끼리 순서를 세려면 nth-of-type()으로 바꾸세요. 
        p:nth-of-type(1) { }
        p:nth-of-type(2) { font-size: 100%; }
        p:nth-of-type(3) { font-size: 150%; }
        p:nth-of-type(4) { font-size: 200%; } */
    </style>
</head>
