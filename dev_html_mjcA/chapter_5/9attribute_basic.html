<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <title>CSS3 Selector Basic</title>
    <style>
        input[type="text"] {
            background: red;
        }

        input[type="password"] {
            background: blue;
        }
    </style>
</head>

<body>
    <h2>3. 속성 선택자</h2>
    <hr>

    <form>
        <h1 class="select">제목 글자</h1>
        <input type="text">
        <input type="password">
    </form>
</body>

</html>
