<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
        
    <title>CSS3 Selector Basic</title>
    <style>
        li.select {color:red;}
    </style>
</head>
<body>
    <h2>3. 속성 선택자</h2>
    <p>
        선택자[속성] : 특정한 속성이 있는 태그 선택<br>
        선택자[속성=값] : 특정한 속성 내부 값과 같은 태그 선택<br>
    </p>
    <hr>

    <h1 class="select">제목 글자</h1>
    <ul>        
        <li class="select">사과</li>
        <li>바나나</li>
        <li>오렌지</li>
        <li>감</li>
    </ul>
</body>
</html>
