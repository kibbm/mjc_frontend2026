import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/*

const SCENE_SPEC = {

  version: '1.0',

  backdrop: { x:0, z:-4.35, height:7.35, texture:'matte charcoal teal plaster', color:'#273238', rearWindow:{position:[3.15,3.58,-4.24],size:[2.23,3.7],nightBlue:'#34495b'} },
  actor: { count:1, position:[0.18,0.82,0.22], height:1.86, facing:'+Z', pose:'standing, slight head tilt, holding single paper letter', costume:'graphite tailored jacket, black trousers and dark brown shoes', visible:true },

  ],

    {name:'Amber_Side_Fill',type:'SPOT',position:[-5.25,5.7,2.05],target:[-0.25,1.6,0.15],color:'#eeb278',powerWattsApprox:420,coneDegrees:45},
    {name:'Lamp_Practical',type:'POINT',position:[2.42,1.86,-0.45],color:'#ffd09a',powerWattsApprox:55},

  palette: {curtain:'#581e2a',goldTrim:'#b89461',floor:'#765039',walls:'#273238',costume:'#34383b',moonlight:'#7daccb',keyLight:'#ffcc93'},

  objectGroups: ['Theatre_Shell','Proscenium','Velvet_Curtains','Stage_Floor_Planks','Backdrop','Window_Set','Lighting_Rig','Actor_Solo','Bentwood_Chair','Writing_Table','Practical_Lamp','Spotlight_Haze','Audience_Rows']
};
window.MONOLOGUE_SCENE_SPEC = SCENE_SPEC;

const host = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:false, preserveDrawingBuffer:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.85));

renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;

renderer.toneMappingExposure=1.08;
renderer.setClearColor(0x090c12,1);
host.appendChild(renderer.domElement);

const scene=new THREE.Scene();scene.background=new THREE.Color(0x080a10);scene.fog=new THREE.FogExp2(0x0b1018,0.009);
const camera=new THREE.PerspectiveCamera(39,innerWidth/innerHeight,.1,125);

const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,3.36,0);controls.enableDamping=true;controls.dampingFactor=.055;controls.minDistance=4.1;controls.maxDistance=46;

const root=new THREE.Group();root.name='Solo_Monologue_Theatre';scene.add(root);
const GR={};const stageY=.82;
function addNamed(obj,name,parent=root){obj.name=name;parent.add(obj);return obj}
function group(name,parent=root){return addNamed(new THREE.Group(),name,parent)}
function mat(color,rough=.78,metal=0){return new THREE.MeshStandardMaterial({color,roughness:rough,metalness:metal})}

function ellipsoid(parent,name,x,y,z,sx,sy,sz,material){const o=new THREE.Mesh(new THREE.SphereGeometry(1,24,16),material);o.position.set(x,y,z);o.scale.set(sx,sy,sz);o.castShadow=true;o.receiveShadow=true;return addNamed(o,name,parent)}
function cyl(parent,name,rt,rb,h,material,x=0,y=0,z=0,segments=16){const o=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,segments),material);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;return addNamed(o,name,parent)}
function rod(parent,name,a,b,r,material,segments=10){const pa=new THREE.Vector3(...a),pb=new THREE.Vector3(...b),v=pb.clone().sub(pa);const m=cyl(parent,name,r,r,v.length(),material,...pa.clone().add(pb).multiplyScalar(.5).toArray(),segments);m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),v.normalize());return m}
function lineTube(parent,name,pts,r,material){const g=new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts.map(p=>new THREE.Vector3(...p))),32,r,7,false);const m=new THREE.Mesh(g,material);m.castShadow=true;return addNamed(m,name,parent)}
function cvs(w=512,h=512){const c=document.createElement('canvas');c.width=w;c.height=h;return [c,c.getContext('2d')]}
function tex(canvas,repeatX=1,repeatY=1){const t=new THREE.CanvasTexture(canvas);t.colorSpace=THREE.SRGBColorSpace;t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(repeatX,repeatY);t.anisotropy=8;return t}
function rng(seed){let s=seed>>>0;return ()=>((s=(Math.imul(1664525,s)+1013904223)>>>0)/4294967296)}

// Procedural canvas grain, woven velvet and battered wall plaster textures.
const woodCanvas=(()=>{const [c,x]=cvs(1024,256),rand=rng(189);x.fillStyle='#806049';x.fillRect(0,0,c.width,c.height);for(let i=0;i<3800;i++){let px=rand()*c.width,py=rand()*c.height;const a=rand()*.11;x.strokeStyle=rand()>.52?`rgba(32,18,11,${a})`:`rgba(244,205,151,${a*.9})`;x.lineWidth=.3+rand()*1.4;x.beginPath();x.moveTo(px,py);x.bezierCurveTo(px+30,py+(rand()-.5)*5,px+100,py+(rand()-.5)*6,px+180*rand(),py);x.stroke()}return c})();
const woodMap=tex(woodCanvas,1,1);
const velvetCanvas=(()=>{const [c,x]=cvs(512,1024),rand=rng(9);x.fillStyle='#702936';x.fillRect(0,0,c.width,c.height);for(let j=0;j<512;j++){let a=.04+.045*Math.sin(j*.13);x.fillStyle=`rgba(14,0,6,${Math.max(0,a)})`;x.fillRect(j,0,1,c.height)}for(let i=0;i<7000;i++){x.fillStyle=rand()>.5?'rgba(255,175,174,.028)':'rgba(10,1,8,.04)';x.fillRect(rand()*512,rand()*1024,.6,6+rand()*60)}return c})();
const velvetMap=tex(velvetCanvas,2,1);
const plasterCanvas=(()=>{const [c,x]=cvs(768,768),r=rng(44);x.fillStyle='#344048';x.fillRect(0,0,768,768);for(let i=0;i<27000;i++){const v=r()>.48?240:14;x.fillStyle=`rgba(${v},${v},${v},${r()*.045})`;x.fillRect(r()*768,r()*768,1+r()*5,1+r()*5)}for(let i=0;i<55;i++){x.strokeStyle=`rgba(8,12,16,${r()*.05})`;x.beginPath();const xx=r()*768,yy=r()*768;x.moveTo(xx,yy);x.lineTo(xx+80*r(),yy+70*r());x.stroke()}return c})();
const plasterMap=tex(plasterCanvas,2.2,1.4);
const walnut=mat('#38251f',.6,.05), woodTrim=mat('#4b3028',.57,.04), brass=mat('#aa8450',.32,.74), brassDark=mat('#635035',.42,.66);
const darkMetal=mat('#1d2025',.36,.72), darkVelvet=mat('#4b1824',.94), stageBase=mat('#16171a',.85);

const shell=group('Theatre_Shell');
box(shell,'Theatre_Left_Wall',.4,10,20,mat('#191c24',1),-8.9,4.2,3,false);
box(shell,'Theatre_Right_Wall',.4,10,20,mat('#191c24',1),8.9,4.2,3,false);
box(shell,'Theatre_Rear_Wall',18,11,.45,mat('#161923',1),0,4.0,-5.1,false);
box(shell,'Theatre_Ceiling',18,.3,22,mat('#090b10',1),0,9.8,3,false);
box(shell,'Audience_Concrete',19,.25,26,mat('#15151a',.9),0,-.25,10,false);

const stage=group('Stage_Floor_Planks');
box(stage,'Stage_Raised_Platform',14.8,.78,9.2,stageBase,0,.39,0);
box(stage,'Stage_Front_Fascia',14.8,.68,.14,walnut,0,.42,4.60);
box(stage,'Stage_Gold_Edge',14.8,.035,.065,brassDark,0,.805,4.57);
const floorMats=[];for(let i=0;i<8;i++){const ma=new THREE.MeshStandardMaterial({map:woodMap,color:new THREE.Color().setHSL(.075,.17,.62+i*.010),roughness:.64,metalness:.025});floorMats.push(ma)}
const randFloor=rng(210);const rows=26;
for(let iz=0;iz<rows;iz++){const z=-4.38+(iz+.5)*(8.81/rows);const split=(iz%2===0?[-7.38,-2.8,1.35,7.38]:[-7.38,-4.5,.6,7.38]);for(let j=0;j<split.length-1;j++){const xx=(split[j]+split[j+1])/2,w=split[j+1]-split[j]-.024;let plank=box(stage,`Oak_Plank_${String(iz+1).padStart(2,'0')}_${j+1}`,w,.085,.324,floorMats[Math.floor(randFloor()*8)],xx,.797,z,false);plank.receiveShadow=true}}
for(let i=0;i<12;i++){const xx=-6.5+i*1.18;box(stage,`Floor_Subtle_Seam_${i}`, .012,.004,8.82,mat('#30241e',.9),xx,.847,0,false)}

// Proscenium (in front of curtain) and small old-theatre ornament.
const pro=group('Proscenium');
box(pro,'Left_Proscenium_Pillar',.88,8.7,.71,woodTrim,-7.28,4.38,4.84);
box(pro,'Right_Proscenium_Pillar',.88,8.7,.71,woodTrim,7.28,4.38,4.84);
box(pro,'Proscenium_Top_Lintel',15.45,1.12,.82,woodTrim,0,8.22,4.86);
for(const s of [-1,1]){box(pro,`Pillar_Gold_Inner_${s}`, .055,8.12,.082,brass,s*6.83,4.29,5.22,false);box(pro,`Pillar_Gold_Outer_${s}`, .05,8.20,.07,brassDark,s*7.74,4.3,5.2,false);box(pro,`Pillar_Capital_${s}`,1.22,.21,.87,walnut,s*7.28,8.24,4.86)}
box(pro,'Proscenium_Gold_Top_Fillet',15.28,.095,.09,brass,0,7.7,5.32,false);
box(pro,'Proscenium_Upper_Gold_Line',15.3,.08,.09,brassDark,0,8.76,5.30,false);
for(let i=-6;i<=6;i++){const ornament=ellipsoid(pro,`Gold_Motif_${i}`,i*1.1,8.22,5.315,.125,.058,.04,brass);ornament.castShadow=false}

// Top drape plus pleated side curtains. The geometry has real folds, not flat paintings.
const curtain=group('Velvet_Curtains');
const redVelvet=new THREE.MeshStandardMaterial({map:velvetMap,color:'#9c5b66',roughness:.98,metalness:0,side:THREE.DoubleSide});
function pleatedCurtain(parent,name,x1,x2,z,upper,lower,phase=0){const across=72,down=28,positions=[],uv=[],indices=[];for(let iy=0;iy<=down;iy++){const t=iy/down,y=upper-(upper-lower)*t;for(let ix=0;ix<=across;ix++){const u=ix/across,x=x1+(x2-x1)*u;const folds=.16*Math.cos(u*Math.PI*12+phase)+.057*Math.sin(u*Math.PI*23+phase*.5);const billow=(1-.36*t)*folds;const bottomSag=t> .92 ? .065*Math.sin(u*27):0;positions.push(x,y-bottomSag,z+billow);uv.push(u,t)}}for(let iy=0;iy<down;iy++){for(let ix=0;ix<across;ix++){const a=iy*(across+1)+ix,b=a+across+1;indices.push(a,b,a+1,b,b+1,a+1)}}const g=new THREE.BufferGeometry();g.setIndex(indices);g.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));g.computeVertexNormals();const m=new THREE.Mesh(g,redVelvet);m.castShadow=true;m.receiveShadow=true;return addNamed(m,name,parent)}
pleatedCurtain(curtain,'Crimson_Curtain_Left',-6.80,-4.70,4.23,8.08,.84,.1);
pleatedCurtain(curtain,'Crimson_Curtain_Right',4.70,6.80,4.23,8.08,.84,1.7);
pleatedCurtain(curtain,'Red_Upper_Valance',-6.90,6.90,4.25,7.93,6.97,2.1);
for(const sign of [-1,1]){const x=sign*5.54;lineTube(curtain,`Curtain_Bronze_Tie_${sign}`,[[x-.45,3.97,4.49],[x,3.88,4.57],[x+.46,3.97,4.49]],.035,brass);cyl(curtain,`Tie_Tassel_${sign}`,.056,.014,.31,brass,x,3.70,4.57,12)}

const back=group('Backdrop');
const plaster=new THREE.MeshStandardMaterial({map:plasterMap,color:'#657079',roughness:1,metalness:0});
box(back,'Aged_Painted_Back_Wall',13.8,7.65,.27,plaster,0,4.58,-4.38,false);

}
