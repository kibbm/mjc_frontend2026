<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jQuery Basic</title>
    <script src="https://code.jquery.com/jquery-4.0.0.js"></script>
    <script>
        // ..left속성, top속성과 같은 위치 속성을 ㅎ사용하려면 position속성을 absolute또는 relative로 지정해야합니다.

//         . Animate()메서드는 메서드 체이닝을 사용하면 애니메이션이 종료된 후에도 새로운 애니메이션을 연속해서 실행할 수 있습니다.
// ~> 빨간색 직사각형을 만드는 첫번째 animate()메서드가 500밀리초 동안 실행됨. 이어서 도형을 이동시키는 두번째 animate()메서드가 500밀리초동안 실행됩니다. 



        //    이벤트를 연결합니다.
        $(document).ready(function () {
            //    이벤트를 연결합니다.
            $('#box').css({
                width: 100, 
                height: 100, 
                background: 'red',
                position:'absolute',
                left:10, 
                top:10
            }).animate({
                width:300,
                opcity:0.5,
            }, 500).animate({
                opcity:1,
                left:100,
                top:200
            }, 500);
        });
    </script>
</head>

<body>
    <h2>05 시각 효과</h2>
    <h4>5.1시각 효과 메서드</h4>
    <h4><b>5.2애니메이션 효과</b></h4>
    <hr>

    
    <div id="box"></div>
</body>

</html>
