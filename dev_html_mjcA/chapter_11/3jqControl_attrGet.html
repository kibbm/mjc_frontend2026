<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jQuery Basic</title>
    <script src= "https://code.jquery.com/jquery-4.0.0.js" ></script>
    <script>
        //이벤트를 연결합니다.
        $(document).ready(function () { 
            //속성을 추출합니다.
            let src = $('script').attr('src');

            //출력합니다.
            alert(src);            
        });
    </script>
</head>

<body> 
    <h2>02 문서 객체 선택</h2>
    <h4>3.1속성 조작</h4>
    <p>jQuery라이브러리를 사용해 scrip태그를 선택하고 src속성을 추출합니다.<br>
         Script태그가 2개 있으므로 문서 객체 속성을 추출하면 먼저 등장하는 scrip태그 속성을 추출합니다. </p>

         <hr/>
</body>

</html>
