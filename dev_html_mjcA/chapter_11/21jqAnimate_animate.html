<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jQuery Basic</title>
    <script src="https://code.jquery.com/jquery-4.0.0.js"></script>
    <script>
        // ..div태그의 width속성과 height속성을 변경합니다. 

        
        //    이벤트를 연결합니다.
        $(document).ready(function () {
            //    이벤트를 연결합니다.
            $('#box').css({
                width: 100, 
                height: 100, 
                background: 'red'
            }).animate({
                width:300,
                opcity:0.5,
            }, 500);
        });
    </script>
</head>

<body>
    <h2>05 시각 효과</h2>
    <h4>5.1시각 효과 메서드</h4>
    <h4><b>5.2애니메이션 효과</b></h4>
    <hr>

    
    <div id="box"></div>
</body>

</html>
