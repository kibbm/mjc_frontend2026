<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jQuery Basic</title>
    <script src="https://code.jquery.com/jquery-4.0.0.js"></script>
    <script>
        // ..정확한 숫자가 아니라 ‘+=<숫자>’형태의 문자열을 입력하면 현재 속성에서 위치 또는 크기를 상대적으로 변환합니다. 

//jQuery라이브러리는 animate()메서드 또는 delay()메서드를 사용해 [그림11-5]와 같이 애니메이션을 예약합니다. 
//애니메이션 큐에 차곡차곡 들어간 애님네이션은 동시에 실행되는 것이 아니라 차례대로 실행됩니다.


        
        //    이벤트를 연결합니다.
        $(document).ready(function () {
            //    이벤트를 연결합니다.
            $('#box').css({
                width: 100, 
                height: 100, 
                background: 'red',
                position:'absolute', 
                left: 10,
                top: 10
            }).animate({
                width:'+=300,', 
                opcity:'-+0.5',
                left: '+=300',
                opacity:0.5
            }, 500);
        });
    </script>
</head>

<body>
    <h2>05 시각 효과</h2>
    <h4>5.1시각 효과 메서드</h4>
    <h4><b>5.2애니메이션 효과</b></h4>
    <hr>

    
    <div id="box"></div>
</body>

</html>
