<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jQuery Basic</title>
    <script src= "https://code.jquery.com/jquery-4.0.0.js" ></script>
    <script>
        // ...함수를 이용해 속성 지정하기

        //이벤트를 연결합니다.
        $(document).ready(function () { 
            //문서 객체를 추가합니다.
            let output = '';
            for(let i=0; i<256; i++){
                output += '<div></div>';
            }
            document.body.innerHTML = output;
            //스타일을 적용합니다.
            $('div').css({
                height:2, 
                backgroundColor:function(i){
                    return 'rgb('+i+', '+i+', '+i+')';
                    return 'rgb('+i+', '+i+', '+i+')';
                }
            });           
        });
    </script>
</head>

<body> 
   <h4>3.2스타일 조작</h4>
    <ol>
        <li>속성 값을 입력해 속성 지정하기</li>
        <li>객체를 입력해 속성 지정하기</li>
        <li><b>함수를 이용해 속성 지정하기</b></li>
    </ol>
    <hr>

</body>

</html>
