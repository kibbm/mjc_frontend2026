<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jQuery Basic</title>
    <script src="https://code.jquery.com/jquery-4.0.0.js"></script>
    <script>
//         ... Text()메서드를 사용해 선택된 모든 문서 객체의 글자를 추출합니다. 
//          . html()메서드는 지금까지 살펴본 메서드처럼 첫번째에 위치한 문서 객체의 글자를 추출합니다.


        //이벤트를 연결합니다.
        $(document).ready(function () {
            //변수를 선언합니다.
            let text = $('h1').text();
            let html = $('h1').html();
            //출력합니다.
            alert("text: " + text);
            alert("html: " + html);
        });
    </script>
</head>

<body>
    <h4>3.3글자 조작</h4>
    <ol>
        <li>text()메서드로 내부 글자 조작하기</li>
        <li><b>html()메서드로 내부 글자 조작하기</b></li>
    </ol>
    <hr>

    <h1>Header-0</h1>
    <h1>Header-1</h1>
</body>

</html>
