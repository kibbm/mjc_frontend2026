<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <title>6absolutePosition</title>
    <style>
        /* 초기화 */
        * {
            margin: 0;
            padding: 0;
        }

        /* 주제 */
        body {
            background: green;
        }

        #container {
            /* 색상 및 크기 적용 */
            width: 500px;
            height: 250px;
            background: orange;

            /* 위치 설정 */
            position: absolute;
            left: 50%;
            top: 50%;
            margin-left: -250px;
            margin-top: -125px;
        }
    </style>
</head>

<body>
     <h2>ch7_2 요소 배치...절대위치 사용, 중앙에 배치, 고정 위젯에 배치</h2>
    <h3>ch7_2_2 중앙에 배치</h3>
    <p>
        1. 중앙 정렬하려는 div태그의 position속성을 absolute로 지정합니다.<br>
        2. left속성과 top속성을 모두 50%로 지정합니다.<br>
        3. 중앙에 정렬하려는 div태그의 margin-left속성과 margin-top속성에 음수를 입력합니다. 
        그러면 요소가 왼쪽 위로 끌어당겨지면서 요소 중심이 페이지 중앙에 위치합니다. 
        이때 입력하는 값은 div태그 너비와 높이의 정확히 절반이어야 합니다. 
    </p>

    <hr>

    <div id="body1">
        <div id="container">
            <h1>요소의 중앙 배치</h1>
        </div>
    </div>
</body>

</html>
