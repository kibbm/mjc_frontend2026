<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    
    <title>2.가시속성</title>
    <style>
        #box {
            /* display: none; */
            /* display: block; */
            /* display: inline; */
            display: inline-block;
        }
    </style>
</head>
<body>
    <h2>02.가시속성(태그가 화면에 보이는 방식을 지정)</h2>
    <h3>. none:화면에 보이지 않음</h3>
    <h3>. block:블록 박스 형식으로 지정</h3>
    <h3>. inline:인라인 형식으로 지정</h3>
    <h3>. inline-block:인라인 블록 형식으로 지정</h3>
    <hr>

    <span>더미 객체</span>
    <div id="box">대상 객체</div>
    <span>더미 객체</span>
</body>
</html>
