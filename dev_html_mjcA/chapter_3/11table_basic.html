<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    
    <title>11table_basic</title>

</head>
<body>
    <table> 
        <tr><!--표에 행(table row) 삽입-->
            <th>번호</th> <!--표의 제목 셀(table headling) 생성-->
            <th>이름</th>
            <th>나이</th>
        </tr>
        <tr>
            <td>1</td> <!--표의 일반 셀(table data) 생성-->
            <td>홍길동</td>
            <td>20</td>
        </tr>
        <tr>
            <td>2</td> <!--표의 일반 셀(table data) 생성-->
            <td>김철수</td>
            <td>30</td>
        </tr>

</body>
</html>
