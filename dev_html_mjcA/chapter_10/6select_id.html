<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Basic</title>
    <script>
        //이벤트를 연결합니다.
        window.onload = function () {
            // 문서 객체를 선택합니다.
            let header = document.getElementById('header');

            // 문서 객체를 조작합니다.
            header.style.color = 'orange';
            header.style.background = 'red';
            header.innerHTML = 'From JavaScript';
        };
    </script>
</head>

<body>
    <h1 id="header">header</h1>

    <hr>
    <h2>02문서 객체 선택</h2>
    <h4>1getElementById()메서드를 사용해 문서 객체 1개 선택하기</h4>
    <p>.id속성을 사용해 문서 객체를 선택하고 스타일과 내부 글자를 조작합니다.<br>
        . js에서 id속성을 중복했을 때 문제가 되는 부분이 바로 getElementById()메서드입니다.
    </p>


</body>

</html>
