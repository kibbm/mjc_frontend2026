<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Basic</title>
    <script>
        //이벤트를 연결합니다.
        window.onload = function () {
            // 변수를 선언합니다.
            let output = '';
            for (let i = 0; i < 10; i++) {
                output += '<h1>Header -' + i + '</h1>';
            }

            //문서 객체 내부의 글자를 변경합니다.
            document.body.textContent = output;
            //innerHTML 속성을 사용합니다.
            // document.body.innerHTML = output;

        };
    </script>
</head>

<body>

    <hr>
    <h2>03문서 객체 조작</h2>
    <ol>
        <li><b>글자 조작</b></li>
        <li>스타일 조작</li>
        <li>속성 조작</li>
    </ol>

    <p>1textContext속성을 사용해 문서 객체 내부의 글자를 변경하면 입력한 글자가 body태그 내부에 바로 들어갑니다.<br>
        2innerHTML속성을 사용하면 textContext속성과 달리 HTML태그를 적용해 내부 글자를 변경합니다.
    </p>

</body>

</html>
