<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traditional Event - Default Event</title>
    <script>
        //이벤트를 연결합니다.
        window.onload = function(){
            //문서 객체를 선택합니다.
            let button = document.getElementById('button');

            //이벤트를 연결합니다.
            button.onclick = function(){
                //기본 이벤트를 제거합니다.
                return false;//false이므로 연결된 페이지로 이동하지 않음.
            }
        }
    </script>
</head>

<body>
    <a id="button" href="http://hanbit.co.kr">버튼</a>


    <hr>
    <h2>04이벤트</h2>
    <ol>
        <li><b>이벤트 연결</b>
            <ul>
                <li>1인라인 이벤트 모델(문서 객체에 이벤트를 연결하는 방식) 사용하기</li>
                <li>2script태그에 인라인 이벤트 모델 사용하기</li>
                <li>3고전 이벤트 모델</li>
            </ul>
        </li>
        <li>이벤트 사용</li>
    </ol>
</body>

</html>
