<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Object Model</title>
    <script>
        // h1태그의 배경 색상을 변경합니다.
        document.querySelector('h1').style.backgroundColor = 'red';
        // h2태그의 글자 색상을 변경합니다.
        document.querySelector('h2').style.color = 'red';
    </script>
</head>

<body>
    <h1>Process - 1</h1>
    <h2>Process - 2</h2>

    <hr>
    <h2>01 문서객체모델(DOM)의 기본 용어와 개념</h2>
    <ol>
        <li>문서 객체 모델 기본 용어 <br><b>"어떻게 자바스크립트에서 문서 객체를 조작하나요?"</b></li>
        <li>웹 페이지 실행 순서</li>
    </ol>
</body>

</html>
