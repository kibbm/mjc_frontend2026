<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jQuery Basic</title>
    <script src="https://code.jquery.com/jquery-4.0.0.js"></script>
    <script>
        // ...한글이름을 입력했으면 입력 양식을 제출하고, 
        // 한글이 아니라면 기본 이벤트를 제거해서 입력 양식을 제출하지 않게 합니다.


        //    이벤트를 연결합니다.
        $(document).ready(function () {
            //    이벤트를 연결합니다.
            $('form').submit(function(event){
                // input태그의 값을 추출합니다.
                let value = $('input').val();// Input 태그값을 추출하거나 조작하는 val()메소드를 사용했음. 

                // 유효성을 검사합니다.
                if(value.replace(/[가-힣]/g, '').length == 0){ //정규표현식
                    //  유효성 검사 통과
                    alert('과정을 진행합니다.');
                }else{
                    // 유효성 검사 실패
                    alert('한글 이름을 입력해주세요');
                    event.preventDefault();
                }
            });
        });
    </script>
</head>

<body>
    <h2>04 이벤트</h2>
    <h4>4.1이벤트 연결</h4>
    <h4><b>4.2이벤트 사용</b></h4>
    <hr>

    <form>
        <form>
            <label>이름</label>
            <input type="text">
            <input type="submit">
        </form>
    </form>
</body>

</html>
