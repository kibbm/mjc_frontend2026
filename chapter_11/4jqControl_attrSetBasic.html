<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jQuery Basic</title>
    <script src= "https://code.jquery.com/jquery-4.0.0.js" ></script>
    <script>
        //..jQuery라이브러리를 사용해 문서 객체를 선택하고 메서드를 실행하면 모든 문서 객체에 한 번에 적용된다는 것을 기억합니다. 


        //이벤트를 연결합니다.
        $(document).ready(function () { 
            //속성을 지정합니다.
            $('img').attr('alt', 'jQuery라이브러리를 사용한 속성 지정');
            $('img').attr('src', 'http://via.placeholder.com/100x100');
            $('img').attr('width', '100');
        });
    </script>
</head>

<body> 
    <h2>02 문서 객체 선택</h2>
    <h4>3.1속성 조작</h4>
    <ol>
        <li><b>속성 값을 입력해 속성 지정하기</b></li>
        <li>객체를 입력해 속성 지정하기</li>
        <li>함수를 이용해 속성 지정하기</li>
    </ol>
    <hr>

    <img>
    <img>
    <img>
</body>

</html>
