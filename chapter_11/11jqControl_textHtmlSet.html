<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jQuery Basic</title>
    <script src="https://code.jquery.com/jquery-4.0.0.js"></script>
    <script>
// ..(1) text()메서드로 내부 글자 조작하기
// …실행하기 전 실행 결과를 미리 예측해 보세요. 
// . Text()메서드를 사용하면 일반 글자처럼 출력되지만, html()메서드를 사용하면 태그로 만들어집니다.


        //이벤트를 연결합니다.
        $(document).ready(function () {
            //내부 글자를 변경합니다.
            $('h1:nth-child(1)').text('<a href="#">text()</a>');
            $('h1:nth-child(2)').html('<a href="#">html()</a>');
        });
    </script>
</head>

<body>
    <h4>3.3글자 조작</h4>
    <ol>
        <li><b>text()메서드로 내부 글자 조작하기</b></li>
        <li>html()메서드로 내부 글자 조작하기</li>
    </ol>
    <hr>

    <h1>Header-0</h1>
    <h1>Header-1</h1>
</body>

</html>
