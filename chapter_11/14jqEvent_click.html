<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jQuery Basic</title>
    <script src="https://code.jquery.com/jquery-4.0.0.js"></script>
    <script>
        // 이벤트를 연결합니다.
        $(document).ready(function(){
            // 이벤트를 연결합니다.
            $('h1').click(function(){
                alert('클릭!');
            });
        });
    </script>
    </head>

<body>
    <h2>04 이벤트</h2>
    <h4><b>4.1이벤트 연결</b></h4>
    <h4>4.2이벤트 사용</h4>
    <hr>

    <h1>Click</h1>
</body>

</html>
