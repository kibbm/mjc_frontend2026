<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <title>ch7Layout</title>
    <style>
        /* 초기화 */
        * { margin: 0; padding: 0; }

        /* 주제 */
        body { background: red; }

        #container {
            /* 색상 및 크기 적용 */
            width: 500px; height: 250px;
            background: orange;
            
            /* 위치 설정 */
            position: absolute;
            left: 50%; top: 50%;
            margin-left: -250px;
            margin-top: -125px;
        }
    </style>
</head>

<body>

    <h2>7.1 수평, 중앙, One True 정렬 레이아웃</h2>
    <h3>2. 중앙 정렬 레이아웃2</h3>
    <hr>

     <div id="container">
        <h1>요소의 중앙 배치</h1>
    </div>
    </body>
    </html>
