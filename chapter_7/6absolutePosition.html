<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    
    <title>6absolutePosition</title>
    <style>
        #container{
            width:500px;    height: 300px;
            border: 3px solid black;
            overflow: hidden;
            position: relative;
        }

        .circle{
            position: absolute;
            width: 100px; height: 100px;
            border-radius: 50% 50%;
        }

        #red{
            background: red;
            left: 20px; top: 20px;            
        }
        #green{
            background: green;
            right:20px; top:20px;
        }
        #blue{
            background: blue;
            right: 20px; bottom:20px;
        }
        #yellow{
            background: yellow;
            left: 20px; bottom: 20px;
        }
    </style>
</head>
<body>
    <h2>ch7_2 요소 배치...절대위치 사용, 중앙에 배치, 고정 위젯에 배치</h2>
    <h3>ch7_2_1 절대위치 사용</h3>
    <h4>반드시 기억~!...“자손의 position 속성에 absolute를 적용하려면 부모의 position 속성에 relative를 적용합니다</h4>

    <hr>
<h1>Dummy Text</h1>
<div id="container">
    <div id="red" class="circle"></div>
    <div id="green" class="circle"></div>
    <div id="blue" class="circle"></div>
    <div id="yellow" class="circle"></div>
</div>
<h1>Dummy Text</h1>    

</body>
</html>
