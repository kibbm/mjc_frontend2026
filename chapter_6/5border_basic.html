<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <title>1.박스 속성</title>
    <style>
          .box{
            border-width:thick;
            border-style:dashed;
            border-color:black;

            border-radius:50px 40px 20px 10px; 
          }

</head>

<body>
    <h2>2. 박스 테두리</h2>
    
    <div class="box">
